name: '@simatic-ax/mocks'
version: 0.1.3
author: Siemens AG
type: lib
# Description will be displayed in the apax extension
description: This library contains a collection of mocks
variables:
  APAX_BUILD_ARGS:
    - '--log Debug'
    - --debug

  GITHUB_REG_URL: "https://npm.pkg.github.com"
targets:
  - '1500'
  - 'llvm'
registries:
  '@simatic-ax': 'https://npm.pkg.github.com/'

devDependencies:
  "@ax/sdk": ^2510.0.0
  "@simatic-ax/snippetscollection": ^1.0.0
  "@ax/axunit-mocking": ^8.0.33
dependencies:
  "@ax/system-timer": ^10.0.24

files:
  - 'README.md'
  - 'LICENSE.md'
  - 'docs'
  - 'src'
catalogs:
  "@ax/simatic-ax": ^2510.0.0
