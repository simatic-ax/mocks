name: '@simatic-ax/mocks'
version: 0.1.3
author: Siemens AG
type: lib
# Description will be displayed in the apax extension
description: This library contains a collection of mocks
variables:
  APAX_BUILD_ARGS:
    - '--log Debug'
    - --debug

  GITHUB_REG_URL: "https://npm.pkg.github.com"
targets:

  - 'llvm'
registries:
  '@simatic-ax': 'https://npm.pkg.github.com/'
# Dependencies
publicKeys:
  "@simatic-ax":
    "v1": "3792a7e926775425ccdd29ceed8c368c3008b5b33d7d5550b3cb1f58093e1dff"
    "v2": "7af3e394eb2b285a3d99ab8e1f745cc6db75704b30a80393339c721a92ffffd9"
catalogs:
  "@ax/simatic-ax": 2510.17.0
devDependencies:
  "@ax/sdk": ^2510.7.0
  "@ax/system-timer": ^10.3.25
  "@ax/system": ^10.3.25
  "@simatic-ax/snippetscollection": ^1.0.0
dependencies:
  "@ax/axunit-mocking": ^9.2.28

files:
  - 'README.md'
  - 'LICENSE.md'
  - 'docs'
  - 'bin/llvm'
