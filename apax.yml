name: '@simatic-ax/mocks'
version: 0.1.3
author: Siemens AG
type: lib
variables:
  APAX_BUILD_ARGS:
    - '--log Debug'
    - --debug
  GITHUB_REG_URL: "https://npm.pkg.github.com"
targets:
  - '1500'
  - 'llvm'
scripts:
  publishlib:
    - apax publish --package *.apax.tgz --registry $GITHUB_REG_URL
    - rm *.apax.tgz -f
  createpackage:
    # - apax build
    # - apax test
    - apax version $1
    - apax pack
    - apax publishlib

devDependencies:
  "@ax/sdk": 2411.1.0
  "@simatic-ax/snippetscollection": 1.0.0
registries:
  '@simatic-ax': 'https://npm.pkg.github.com/'
files:
  - 'README.md'
  - 'LICENSE.md'
  - 'docs'
  - 'src' # ship library with source
dependencies:
  "@ax/system-timer": ^10.0.0
  "@ax/axunit-mocking": ^8.0.0
installStrategy: strict
